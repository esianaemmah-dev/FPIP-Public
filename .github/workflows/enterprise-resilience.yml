name: Enterprise resilience gates
on:
  pull_request:
    paths:
      - 'agent-service/**'
      - 'infra/enterprise-resilience/**'
      - 'docs/openapi/**'
      - 'scripts/validate-enterprise-artifacts.py'
      - 'tests/load/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip', cache-dependency-path: 'agent-service/requirements.txt' }
      - name: Install backend dependencies
        run: python -m pip install -r agent-service/requirements.txt
      - name: Backend tests
        working-directory: agent-service
        run: python -m pytest
      - name: Validate API and parameters
        run: python scripts/validate-enterprise-artifacts.py
      - name: Compile Bicep
        run: az bicep build --file infra/enterprise-resilience/main.bicep
